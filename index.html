<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19171d">
<meta name="color-scheme" content="dark">
<meta name="description" content="Flowday — календарь событий и простой список дел">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flowday">
<title>Flowday — планировщик</title>
<style>
:root{color-scheme:dark;--bg:#19171d;--surface:#242129;--surface2:#2c2932;--text:#f1edf4;--muted:#a49baa;--line:#39343f;--accent:#d978a5;--accent-soft:#3a2c37;--green:#59bd9a;--red:#ef7b91;--shadow:0 12px 35px #0004;--radius:20px}
:root[data-theme=light]{color-scheme:light;--bg:#f7f5f8;--surface:#fff;--surface2:#f2eef4;--text:#252231;--muted:#898395;--line:#e8e1eb;--accent:#c96596;--accent-soft:#f7e7ef;--green:#299b78;--red:#d95c77;--shadow:0 12px 35px #39243d10}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:auto;min-height:100dvh;padding:18px 22px calc(155px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:12px;overflow:hidden;background:#d978a5}.logo img{width:100%;height:100%;object-fit:cover}.topright{display:flex;align-items:center;gap:8px}.datepill,.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 12px;color:var(--text)}.iconbtn{width:42px;height:42px;display:grid;place-items:center;line-height:0}.iconbtn svg{width:20px;height:20px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:6px;padding:5px;border:1px solid var(--line);background:var(--surface2);border-radius:15px;margin-bottom:20px;width:max-content;max-width:100%;overflow:auto}.tabs button{background:transparent;color:var(--muted);padding:9px 15px;border-radius:11px;white-space:nowrap;font-weight:650}.tabs button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px #0002}
h1{font-size:30px;letter-spacing:-1px;margin:8px 0 4px}.sub{color:var(--muted);margin:0 0 22px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panelhead h2{font-size:17px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.primary{background:var(--accent);color:white;padding:10px 15px;border-radius:12px;font-weight:750}.secondary{background:var(--accent-soft);color:var(--text);padding:9px 12px;border-radius:11px;font-weight:650}.ghost{background:var(--surface2);color:var(--muted);padding:8px 11px;border-radius:10px}.danger{color:var(--red)}
.daynav{display:flex;align-items:center;gap:9px}.daynav button{background:var(--surface2);padding:7px 12px;border-radius:10px}.daytitle{font-weight:750}
.eventlist{display:grid;gap:10px}.eventcluster{display:grid;gap:8px;align-items:start}.eventcluster .event{min-width:0}body:has(.taskdock.open) .app{padding-bottom:calc(42vh + 175px + env(safe-area-inset-bottom))}.event{border:1px solid var(--line);border-left:4px solid var(--event-color,var(--accent));border-radius:14px;background:var(--surface2);padding:13px;min-width:0;position:relative}.eventtop{display:flex;justify-content:space-between;align-items:start;gap:8px}.eventname{font-weight:750;overflow-wrap:anywhere}.eventtime{font-size:12px;color:var(--muted);white-space:nowrap}.eventdesc{font-size:13px;color:var(--muted);margin-top:5px;white-space:pre-wrap}.eventprogress{height:4px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:9px}.eventprogress span{height:100%;display:block;background:var(--event-color,var(--accent))}.event.current{box-shadow:0 0 0 1px var(--accent)}.event.past{opacity:.5}.subtasks{display:grid;gap:5px;margin-top:8px}.subtask{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.check{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;flex:none;padding:0}.check.done{background:var(--green);border-color:var(--green);color:#fff}.doneText{text-decoration:line-through;opacity:.55}
.empty{padding:35px 12px;text-align:center;color:var(--muted)}.empty .emoji{font-size:28px;margin-bottom:8px}.calendar{max-width:800px;margin:auto}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:24px repeat(6,minmax(76px,auto));gap:6px}.calendar-toolbar{display:grid;grid-template-columns:42px minmax(0,1fr) 42px auto;align-items:center;gap:8px;width:100%;min-width:0}.month-arrow{width:42px;height:40px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-size:22px;line-height:1}.month-label{min-width:0;text-align:center;text-transform:capitalize;white-space:nowrap;font-size:15px;font-weight:750}.note-homework-date{display:none;align-items:center;gap:6px}.note-homework-date input{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:6px}.calendar-cell{min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:7px;text-align:left;min-width:0}.calendar-cell.selected{border-color:var(--accent);background:var(--accent-soft)}.calendar-cell.outside{opacity:.3}.calendar-cell.today .num{color:var(--accent);font-weight:800}.num{font-size:13px;font-weight:700}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}.dot{width:6px;height:6px;border-radius:50%}
.listgroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.taskgroup{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;min-width:0}.taskgroup h2{font-size:16px;margin:0}.taskcount{color:var(--muted);font-size:12px}.taskitems{display:grid;gap:8px;margin:12px 0}.taskitem{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;background:var(--surface2);border-radius:10px;min-width:0}.taskitem .check{margin-top:2px}.tasktext{flex:1;min-width:0;overflow-wrap:anywhere}.taskitem.completed .tasktext{text-decoration:line-through;color:var(--muted)}.delete-task{background:transparent;color:var(--muted);padding:0 3px;font-size:17px}.quickadd{display:flex;gap:7px}.quickadd input{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--text)}.quickadd button{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 13px;font-weight:800}
.note-editor{width:100%;min-height:52vh;resize:vertical;border:0;outline:none;background:transparent;color:var(--text);font:16px/1.7 inherit;padding:8px 2px}.note-editor::placeholder{color:var(--muted)}.note-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:13px}.note-actions select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;max-width:100%}
.modalback{position:fixed;inset:0;background:#08070bb8;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.modalback.show{display:flex}.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{font-size:19px;margin:0}.close{background:var(--surface2);border-radius:9px;width:34px;height:34px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}.field textarea{min-height:75px;resize:vertical}.taskinput{display:flex;gap:7px}.taskinput input{flex:1}.taskinput button{background:var(--surface2);border-radius:9px;padding:0 10px}.modalactions{display:flex;justify-content:space-between;gap:8px;margin-top:17px}.toast{position:fixed;z-index:50;bottom:calc(105px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.taskdock{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.dockpanel{display:none;max-width:900px;margin:0 auto 8px;max-height:42vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}.taskdock.open .dockpanel{display:block}.docktabs{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.docktab{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--muted);font-size:11px;font-weight:700;min-width:0}.docktab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.docktab strong{display:block;font-size:17px;margin-bottom:2px}.dockhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.dockhead h3{margin:0;font-size:15px}.dock-empty{font-size:12px;color:var(--muted);padding:5px 0}
@media(max-width:700px){.app{padding:14px 13px calc(165px + env(safe-area-inset-bottom))}.brand{font-size:19px}.tabs{width:100%}.tabs button{flex:1;padding:9px 10px}.listgroups{grid-template-columns:1fr}.calendar-grid{grid-template-rows:22px repeat(6,minmax(57px,auto))}.calendar-cell{min-height:57px;padding:5px}.calendar-toolbar{grid-template-columns:38px minmax(0,1fr) 38px auto;gap:5px}.month-arrow{width:38px;height:38px}.month-label{font-size:14px}.panel{padding:15px}.docktab{font-size:10px}.docktab strong{font-size:15px}}
@media(max-width:420px){h1{font-size:26px}.datepill{font-size:12px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.calendar-grid{grid-template-rows:20px repeat(6,minmax(49px,auto));gap:3px}.calendar-cell{min-height:49px}.calendar-toolbar{grid-template-columns:34px minmax(0,1fr) 34px auto;gap:4px}.month-arrow{width:34px;height:36px}.month-label{font-size:12px}.calendar-toolbar .secondary{padding:8px 7px;font-size:11px}.docktab{padding:9px 2px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo"><img src="icon.svg" alt=""></div>flowday</div><div class="topright"><div class="datepill" id="datePill"></div><button class="iconbtn" id="themeToggle" aria-label="Переключить тему"></button><button class="iconbtn" id="addEvent" aria-label="Создать событие" title="Создать событие"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></header>
<nav class="tabs" id="tabs"><button data-tab="day" class="active">День</button><button data-tab="calendar">Календарь</button><button data-tab="notes">Заметки</button><button data-tab="more">Ещё</button></nav>
<main id="main"></main>
</div>
<div class="taskdock" id="taskdock"><div class="dockpanel" id="dockpanel"></div><div class="docktabs">
<button class="docktab" data-group="general"><strong>☷</strong>Общие дела</button>
<button class="docktab" data-group="urgent"><strong>✦</strong>Срочные дела</button>
<button class="docktab" data-group="today"><strong>◷</strong>Сегодня</button>
<button class="docktab" data-group="homework"><strong>▤</strong>ДЗ</button>
</div></div>
<div class="modalback" id="modalback"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2 id="modalTitle">Новое событие</h2><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateObj=s=>new Date(s+"T12:00:00"),addDays=(s,n)=>{let d=dateObj(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=s=>dateObj(s).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const keys=["general","urgent","today","homework"],labels={general:"Общие дела",urgent:"Срочные дела",today:"Сегодняшние дела",homework:"ДЗ"};
let theme=localStorage.getItem("flowday-theme")||"dark";document.documentElement.dataset.theme=theme;syncThemeColor();
function syncThemeColor(){let m=$('meta[name="theme-color"]');if(m)m.content=theme==="dark"?"#19171d":"#f7f5f8";let c=$('meta[name="color-scheme"]');if(c)c.content=theme}
const blank=()=>({events:[],markers:[],notes:[],info:[],lists:{general:[],urgent:[],today:[],homework:[]},todayStamp:today()});
function load(){let raw;try{raw=JSON.parse(localStorage.getItem("flowday-data")||"{}")}catch{raw={}}let d={...blank(),...raw};if(typeof d.notes==="string"){let text=d.notes;if(/<[a-z][\\s\\S]*>/i.test(text)){let box=document.createElement("div");box.innerHTML=text;text=box.innerText||box.textContent||""}d.notes=text.trim()?[{id:uid(),text,created:today()}]:[]}d.notes=Array.isArray(d.notes)?d.notes:[];d.notes=d.notes.map(n=>typeof n==="string"?{id:uid(),text:n,created:today()}:n);d.markers=Array.isArray(d.markers)?d.markers:[];d.events=Array.isArray(d.events)?d.events:[];d.lists={...blank().lists,...(d.lists||{})};keys.forEach(k=>{if(!Array.isArray(d.lists[k]))d.lists[k]=[]});d.events=d.events.filter(e=>!e.group||e.group==="calendar");d.lists.today=d.lists.today.map(t=>({...t,date:t.date||t.created||d.todayStamp||today()}));d.lists.homework=d.lists.homework.map(t=>({...t,date:t.date||t.created||d.todayStamp||today()}));d.todayStamp=today();return d}
let data=load(),tab="day",selected=today(),month=dateObj(today()),openGroup=null,editing=null;
function save(){localStorage.setItem("flowday-data",JSON.stringify(data))}
function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1900)}
function migrate(){let old;try{old=JSON.parse(localStorage.getItem("flowday-data")||"{}")}catch{return}if(old&&Array.isArray(old.events)){let changed=false;keys.forEach(k=>{let legacy=old.events.filter(e=>e.group===k&&(k!=="today"||e.date===today()));legacy.forEach(e=>{if(!data.lists[k].some(x=>x.text===e.title)){data.lists[k].push({id:e.id||uid(),text:e.title,done:false,created:today()});changed=true}})});if(changed)save()}}
migrate();
function dayEvents(day){return data.events.filter(e=>e.date===day).sort((a,b)=>a.start.localeCompare(b.start))}function dayMarkers(day){return data.markers.filter(m=>m.date===day)}
function min(t){let a=t.split(":").map(Number);return a[0]*60+a[1]}
function timeProgress(e){let n=new Date(),v=n.getHours()*60+n.getMinutes(),a=min(e.start),b=min(e.end);return v<a||v>=b?0:(v-a)/(b-a)*100}
function eventTasks(e){return (e.tasks||[]).slice().sort((a,b)=>Number(a.done)===Number(b.done)?0:Number(b.done)-Number(a.done))}
function render(){if(data.todayStamp!==today()){data.lists.today=[];data.todayStamp=today();save()}syncThemeColor();$("#datePill").textContent=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"short"});$("#themeToggle").innerHTML=theme==="dark"?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>';
$("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#main").innerHTML=tab==="day"?renderDay():tab==="calendar"?renderCalendar():tab==="notes"?renderNotes():renderMore();renderDock();bind()}
function renderDay(){let ev=dayEvents(selected),now=new Date(),nowm=now.getHours()*60+now.getMinutes();return '<h1>'+ (selected===today()?"Твой день":esc(fmt(selected)))+'</h1><p class="sub">В календаре — только события с конкретным временем.</p><section class="panel"><div class="panelhead"><div class="daynav"><button id="prevDay">‹</button><span class="daytitle">'+esc(fmt(selected))+'</span><button id="nextDay">›</button></div><button class="primary" id="createEvent">＋ Событие</button></div>'+(ev.length?'<div class="eventlist">'+renderEventGrid(ev,nowm)+'</div>':'<div class="empty"><div class="emoji">☀️</div><b>Пока нет событий</b><p>Добавь занятие, встречу или другой тайм-блок.</p></div>')+'</section>'}
function eventGroups(events){let groups=[],cluster=[],maxEnd=-1,lanes=[];for(const e of events){let a=min(e.start),b=min(e.end);if(cluster.length&&a>=maxEnd){groups.push(cluster);cluster=[];maxEnd=-1;lanes=[]}let lane=lanes.findIndex(end=>end<=a);if(lane<0){lane=lanes.length;lanes.push(b)}else lanes[lane]=b;maxEnd=Math.max(maxEnd,b);cluster.push({event:e,lane})}if(cluster.length)groups.push(cluster);return groups}
function renderEventGrid(events,nowm){return eventGroups(events).map(group=>'<div class="eventcluster" style="grid-template-columns:repeat('+Math.max(1,Math.max(...group.map(x=>x.lane))+1)+',minmax(0,1fr))">'+group.map(x=>eventCard(x.event,nowm,'grid-column:'+(x.lane+1))).join("")+'</div>').join("")}
function eventCard(e,nowm,gridStyle=""){let a=min(e.start),b=min(e.end),past=b<=nowm,current=a<=nowm&&b>nowm,pct=current?timeProgress(e):0;return '<article class="event '+(past?"past ":"")+(current?"current":"")+'" data-event="'+e.id+'" style="--event-color:'+esc(e.color||"#d978a5")+' ;'+gridStyle+'"><div class="eventtop"><div class="eventname">'+esc(e.title)+'</div><div class="eventtime">'+e.start+' – '+e.end+'</div></div>'+(e.description?'<div class="eventdesc">'+esc(e.description)+'</div>':'')+(current?'<div class="eventprogress"><span style="width:'+pct+'%"></span></div>':'')+(e.tasks?.length?'<div class="subtasks">'+eventTasks(e).map(t=>'<div class="subtask"><button class="check '+(t.done?"done":"")+'" data-event-task="'+t.id+'" data-eid="'+e.id+'">'+(t.done?"✓":"")+'</button><span class="'+(t.done?"doneText":"")+'">'+esc(t.text)+'</span></div>').join("")+'</div>':'')+'</article>'}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),total=42,html='<h1>Календарь</h1><p class="sub">Отметки на даты и события с точным временем.</p><section class="panel calendar"><div class="panelhead"><div class="calendar-toolbar"><button class="month-arrow" id="prevMonth" aria-label="Предыдущий месяц">‹</button><b class="month-label">'+first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button class="month-arrow" id="nextMonth" aria-label="Следующий месяц">›</button><button class="secondary" id="monthToday">Сегодня</button></div></div><div class="calendar-grid">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>'<div class="weekday">'+x+'</div>').join("");for(let i=0;i<total;i++){let d=new Date(y,m,i-offset+1),s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),es=dayEvents(s),ms=dayMarkers(s);html+='<button class="calendar-cell '+(d.getMonth()!==m?"outside ":"")+(s===selected?"selected ":"")+(s===today()?"today":"")+'" data-date="'+s+'"><span class="num">'+d.getDate()+'</span><div class="dots">'+es.slice(0,4).map(e=>'<i class="dot" style="background:'+esc(e.color||"var(--accent)")+'"></i>').join("")+ms.slice(0,4).map(v=>'<i class="dot" style="background:'+esc(v.color||"#59bd9a")+'"></i>').join("")+'</div></button>'}html+='</div></section><section class="panel calendar" style="margin-top:16px"><div class="panelhead"><b>'+esc(fmt(selected))+'</b><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="secondary" id="createMarker">＋ Отметка</button><button class="primary" id="createEvent">＋ Событие</button></div></div>'+(msafe(dayMarkers(selected).length)?'<div class="taskitems">'+dayMarkers(selected).map(v=>'<div class="taskitem"><span class="dot" style="background:'+esc(v.color||"#59bd9a")+';margin-top:7px"></span><span class="tasktext">'+esc(v.title)+'</span><button class="delete-task" data-marker-delete="'+v.id+'">×</button></div>').join("")+'</div>':'')+(dayEvents(selected).length?'<div class="eventlist">'+renderEventGrid(dayEvents(selected),-1)+'</div>':'<p class="muted small">На эту дату пока нет записей.</p>')+'</section>';return html}function msafe(n){return n>0}
function renderNotes(){return '<h1>Заметки</h1><p class="sub">Личный блокнот. Заметки не связаны со списками, пока ты сам этого не выберешь.</p><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="primary" id="newNote">＋ Новая заметка</button></div><div class="eventlist">'+(data.notes.length?data.notes.map(n=>'<section class="panel"><textarea class="note-editor" data-note-editor="'+n.id+'" placeholder="Начни писать…">'+esc(n.text||'')+'</textarea><div class="note-actions"><span class="muted small">Сохраняется автоматически</span><span style="flex:1"></span><label class="muted small" for="note-dest-'+n.id+'">Куда отправить копию:</label><select id="note-dest-'+n.id+'" data-note-category="'+n.id+'"><option value="general">Общие дела</option><option value="urgent">Срочные дела</option><option value="today">Сегодняшние дела</option><option value="homework">ДЗ</option></select><span class="note-homework-date" data-note-date-wrap="'+n.id+'"><label class="muted small" for="note-date-'+n.id+'">Дата ДЗ:</label><input type="date" id="note-date-'+n.id+'" data-note-date="'+n.id+'" value="'+selected+'"></span><button class="secondary" data-note-send="'+n.id+'">Отправить копию</button><button class="ghost danger" data-note-delete="'+n.id+'">Удалить</button></div></section>').join(''):'<section class="panel empty">Здесь пока пусто. Создай первую заметку.</section>')+'</div>'}
function renderMore(){return '<h1>Ещё</h1><p class="sub">Контакты, полезные сведения и резервная копия данных.</p><section class="panel"><div class="panelhead"><h2>Сведения</h2><button class="secondary" id="addInfo">＋ Добавить</button></div>'+(data.info.length?data.info.map((x,i)=>'<div class="taskitem"><div class="tasktext"><b>'+esc(x.title)+'</b><div class="muted small">'+esc(x.value)+'</div></div><button class="delete-task" data-del-info="'+i+'">×</button></div>').join(""):'<p class="muted small">Добавь контакты преподавателей, номера телефонов и другую важную информацию.</p>')+'</section><section class="panel" style="margin-top:14px"><div class="panelhead"><h2>Данные приложения</h2></div><p class="muted small">Данные хранятся в этом браузере. Создай резервную копию, чтобы перенести их на другое устройство.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="exportData">Экспортировать</button><label class="secondary" style="cursor:pointer">Импортировать<input type="file" id="importData" accept="application/json" hidden></label><button class="ghost danger" id="clearData">Очистить всё</button></div></section>'}
function renderDock(){let dock=$("#taskdock");dock.classList.toggle("open",!!openGroup);$$(".docktab").forEach(b=>b.classList.toggle("active",b.dataset.group===openGroup));if(!openGroup){$("#dockpanel").innerHTML="";return}let items=(openGroup==="today"||openGroup==="homework")?data.lists[openGroup].filter(t=>(t.date||t.created||today())===selected):data.lists[openGroup];$("#dockpanel").innerHTML='<div class="dockhead"><h3>'+labels[openGroup]+'</h3><button class="ghost" id="closeDock">Свернуть ×</button></div><div class="taskitems">'+(items.length?items.map(t=>'<div class="taskitem '+(t.done?"completed":"")+'"><button class="check '+(t.done?"done":"")+'" data-list-check="'+t.id+'" data-group="'+openGroup+'">'+(t.done?"✓":"")+'</button><span class="tasktext">'+esc(t.text)+'</span><button class="delete-task" data-list-delete="'+t.id+'" data-group="'+openGroup+'" aria-label="Удалить">×</button></div>').join(""):'<div class="dock-empty">Список пока пуст. Добавь первую запись ниже.</div>')+'</div><form class="quickadd" id="quickAdd"><input id="quickText" maxlength="240" placeholder="Записать дело…"><button type="submit" aria-label="Добавить">＋</button></form>'}
function openModal(e){editing=e?.id||null;let v=e||{};$("#modalTitle").textContent=e?"Редактировать событие":"Новое событие";$("#modalBody").innerHTML='<form id="eventForm"><div class="formgrid"><div class="field full"><label>Название</label><input name="title" maxlength="100" required value="'+esc(v.title||"")+'" placeholder="Например, учёба"></div><div class="field"><label>Дата</label><input type="date" name="date" required value="'+(v.date||selected)+'"></div><div class="field"><label>Начало</label><input type="time" name="start" required value="'+(v.start||"09:00")+'"></div><div class="field"><label>Конец</label><input type="time" name="end" required value="'+(v.end||"10:00")+'"></div><div class="field"><label>Цвет</label><input type="color" name="color" value="'+(v.color||"#d978a5")+'" style="height:42px"></div><div class="field full"><label>Описание</label><textarea name="description" placeholder="Дополнительная информация">'+esc(v.description||"")+'</textarea></div><div class="field full"><label>Чек-лист</label><div id="taskEditor" class="subtasks">'+(v.tasks||[]).map(t=>taskRow(t.text,t.done)).join("")+'</div><button class="ghost" type="button" id="addSubtask">＋ Подзадача</button></div></div><div class="modalactions">'+(e?'<button type="button" class="ghost danger" id="deleteEvent">Удалить</button>':'<span></span>')+'<div style="display:flex;gap:8px"><button type="button" class="ghost" id="cancelEvent">Отмена</button><button class="primary" type="submit">Сохранить</button></div></div></form>';
$("#cancelEvent").onclick=closeModal;$("#addSubtask").onclick=()=>$("#taskEditor").insertAdjacentHTML("beforeend",taskRow("",false));$("#taskEditor").onclick=ev=>{if(ev.target.matches("[data-remove-subtask]"))ev.target.closest(".taskinput").remove()};if(e)$("#deleteEvent").onclick=()=>{if(confirm("Удалить событие?")){data.events=data.events.filter(x=>x.id!==e.id);save();closeModal();render()}};
$("#eventForm").onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),date=f.get("date"),start=f.get("start"),end=f.get("end");if(end<=start){toast("Время окончания должно быть позже начала");return}let tasks=$$("#taskEditor .taskinput").map((row,i)=>({id:row.dataset.id||uid(),text:row.querySelector("input").value.trim(),done:row.querySelector("input[type=checkbox]")?.checked||false})).filter(t=>t.text);let obj={id:v.id||uid(),title:f.get("title").trim(),date,start,end,color:f.get("color"),description:f.get("description"),tasks};if(editing)data.events=data.events.map(x=>x.id===editing?obj:x);else data.events.push(obj);save();closeModal();render();toast("Событие сохранено")};$("#modalback").classList.add("show")}
function openMarkerModal(){$("#modalTitle").textContent="Новая отметка";$("#modalBody").innerHTML='<form id="markerForm"><div class="field"><label>Название отметки</label><input name="title" maxlength="100" required placeholder="Например, день рождения"></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Дата</label><input type="date" name="date" required value="'+selected+'"></div><div class="field"><label>Цвет</label><input type="color" name="color" value="#59bd9a" style="height:42px"></div></div><div class="modalactions"><span></span><div style="display:flex;gap:8px"><button type="button" class="ghost" id="cancelEvent">Отмена</button><button class="primary" type="submit">Сохранить</button></div></div></form>';$("#cancelEvent").onclick=closeModal;$("#markerForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget);data.markers.push({id:uid(),title:f.get("title").trim(),date:f.get("date"),color:f.get("color")});save();closeModal();render();toast("Отметка добавлена")};$("#modalback").classList.add("show")}function taskRow(text,done){return '<div class="taskinput" data-id="'+uid()+'"><input value="'+esc(text)+'" placeholder="Подзадача"><label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><input type="checkbox" '+(done?"checked":"")+'>Готово</label><button type="button" data-remove-subtask>×</button></div>'}
function closeModal(){$("#modalback").classList.remove("show")}
function bind(){$("#themeToggle").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("flowday-theme",theme);render()};$("#addEvent").onclick=()=>openModal();let ce=$("#createEvent");if(ce)ce.onclick=()=>openModal();let cm=$("#createMarker");if(cm)cm.onclick=()=>openMarkerModal();
let p=$("#prevDay"),n=$("#nextDay");if(p)p.onclick=()=>{selected=addDays(selected,-1);render()};if(n)n.onclick=()=>{selected=addDays(selected,1);render()};
$$("[data-marker-delete]").forEach(b=>b.onclick=()=>{data.markers=data.markers.filter(m=>m.id!==b.dataset.markerDelete);save();render()});$$("[data-event]").forEach(el=>el.onclick=()=>{let e=data.events.find(x=>x.id===el.dataset.event);if(e)openModal(e)});
$$("[data-event-task]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();let e=data.events.find(x=>x.id===b.dataset.eid),t=e?.tasks?.find(x=>x.id===b.dataset.eventTask);if(t){t.done=!t.done;save();render()}});
$$("[data-date]").forEach(b=>b.onclick=()=>{selected=b.dataset.date;month=dateObj(selected);render()});
let pm=$("#prevMonth"),nm=$("#nextMonth"),mt=$("#monthToday");if(pm)pm.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};if(nm)nm.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};if(mt)mt.onclick=()=>{selected=today();month=dateObj(selected);render()};
let ai=$("#addInfo");if(ai)ai.onclick=()=>{let title=prompt("Название (например, Преподаватель)");if(!title)return;let value=prompt("Контакт или информация");if(value===null)return;data.info.push({title,value});save();render()};$$("[data-del-info]").forEach(b=>b.onclick=()=>{data.info.splice(Number(b.dataset.delInfo),1);save();render()});let ex=$("#exportData");if(ex)ex.onclick=()=>{let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=url;a.download="flowday-backup.json";a.click();URL.revokeObjectURL(url)};let im=$("#importData");if(im)im.onchange=async()=>{try{let x=JSON.parse(await im.files[0].text());if(!Array.isArray(x.events))throw 0;data={...blank(),...x,lists:{...blank().lists,...(x.lists||{})}};save();render();toast("Данные импортированы")}catch{toast("Не удалось прочитать файл")}};let cl=$("#clearData");if(cl)cl.onclick=()=>{if(confirm("Удалить все события, списки, заметки и сведения?")){data=blank();save();render()}};let ne=$("#noteEditor");if(ne)ne.oninput=()=>{data.notes=ne.value;save()};let sn=$("#sendNote");if(sn)sn.onclick=()=>{let text=$("#noteEditor").value.trim();if(!text){toast("Сначала напиши заметку");return}let k=$("#noteCategory").value;data.lists[k].push({id:uid(),text,done:false,created:today(),...(k==="today"?{date:selected}:{})});data.notes="";save();openGroup=k;render();toast("Добавлено в "+labels[k].toLowerCase())};
let newNoteBtn=$("#newNote");if(newNoteBtn)newNoteBtn.onclick=()=>{data.notes.unshift({id:uid(),text:"",created:today()});save();render();let area=$("[data-note-editor]");if(area)area.focus()};
$$("[data-note-editor]").forEach(area=>area.oninput=()=>{let n=data.notes.find(x=>x.id===area.dataset.noteEditor);if(n){n.text=area.value;save()}});
$("[data-note-category]").forEach(sel=>{let wrap=$('[data-note-date-wrap="'+sel.dataset.noteCategory+'"]');if(wrap)wrap.style.display=sel.value==="homework"?"flex":"none";sel.onchange=()=>{if(wrap)wrap.style.display=sel.value==="homework"?"flex":"none"}});$("[data-note-send]").forEach(btn=>btn.onclick=()=>{let n=data.notes.find(x=>x.id===btn.dataset.noteSend),sel=$('[data-note-category="'+btn.dataset.noteSend+'"]');if(!n||!n.text.trim()){toast("Сначала напиши заметку");return}let k=sel.value,dateInput=$('[data-note-date="'+btn.dataset.noteSend+'"]');data.lists[k].push({id:uid(),text:n.text.trim(),done:false,created:today(),...((k==="today"||k==="homework")?{date:k==="homework"?(dateInput?.value||selected):selected}:{})});save();openGroup=k;render();toast("Копия добавлена в "+labels[k].toLowerCase())});
$$("[data-note-delete]").forEach(btn=>btn.onclick=()=>{data.notes=data.notes.filter(n=>n.id!==btn.dataset.noteDelete);save();render()});
}
$("#tabs").onclick=e=>{let b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;render()};
$("#taskdock").onclick=e=>{let b=e.target.closest(".docktab[data-group]");if(!b)return;openGroup=openGroup===b.dataset.group?null:b.dataset.group;renderDock()};
$("#dockpanel").onclick=e=>{let c=e.target.closest("[data-list-check]");if(c){let t=data.lists[c.dataset.group].find(x=>x.id===c.dataset.listCheck);if(t){t.done=!t.done;save();renderDock()};return}let d=e.target.closest("[data-list-delete]");if(d){data.lists[d.dataset.group]=data.lists[d.dataset.group].filter(x=>x.id!==d.dataset.listDelete);save();renderDock();return}if(e.target.id==="closeDock"){openGroup=null;renderDock()}};
$("#dockpanel").onsubmit=e=>{if(e.target.id!=="quickAdd")return;e.preventDefault();let input=$("#quickText"),text=input.value.trim();if(!text)return;data.lists[openGroup].push({id:uid(),text,done:false,created:today(),...((openGroup==="today"||openGroup==="homework")?{date:selected}:{})});save();renderDock();$("#quickText").focus()};
$("#closeModal").onclick=closeModal;$("#modalback").onclick=e=>{if(e.target===$("#modalback"))closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();openGroup=null;renderDock()}});
if("serviceWorker"in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();setInterval(()=>{if(tab==="day"&&selected===today())render()},60000);
})();
</script>
</body></html>
