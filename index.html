<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const today=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateObj=s=>new Date(s+"T12:00:00"),addDays=(s,n)=>{let d=dateObj(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=s=>dateObj(s).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const keys=["general","urgent","today","homework"],labels={general:"Общие дела",urgent:"Срочные дела",today:"Сегодняшние дела",homework:"ДЗ"};
let theme=localStorage.getItem("flowday-theme")||"dark";document.documentElement.dataset.theme=theme;syncThemeColor();
function syncThemeColor(){document.documentElement.dataset.theme=theme;let m=$('meta[name="theme-color"]');if(m)m.content=theme==="dark"?"#19171d":"#f7f5f8";let c=$('meta[name="color-scheme"]');if(c)c.content=theme}
const blank=()=>({events:[],markers:[],notes:[],info:[],lists:{general:[],urgent:[],today:[],homework:[]},todayStamp:today()});
function load(){let raw;try{raw=JSON.parse(localStorage.getItem("flowday-data")||"{}")}catch{raw={}}let d={...blank(),...raw};if(typeof d.notes==="string"){let text=d.notes;if(/<[a-z][\\s\\S]*>/i.test(text)){let box=document.createElement("div");box.innerHTML=text;text=box.innerText||box.textContent||""}d.notes=text.trim()?[{id:uid(),text,created:today()}]:[]}d.notes=Array.isArray(d.notes)?d.notes:[];d.notes=d.notes.map(n=>typeof n==="string"?{id:uid(),text:n,created:today()}:n);d.markers=Array.isArray(d.markers)?d.markers:[];d.events=Array.isArray(d.events)?d.events:[];d.lists={...blank().lists,...(d.lists||{})};keys.forEach(k=>{if(!Array.isArray(d.lists[k]))d.lists[k]=[]});d.events=d.events.filter(e=>!e.group||e.group==="calendar");d.lists.today=d.lists.today.map(t=>({...t,date:t.date||t.created||d.todayStamp||today()}));d.lists.homework=d.lists.homework.map(t=>({...t,date:t.date||t.created||d.todayStamp||today()}));d.todayStamp=today();return d}
let data=load(),tab="day",selected=/^\d{4}-\d{2}-\d{2}$/.test(localStorage.getItem("flowday-selected-date")||"")?localStorage.getItem("flowday-selected-date"):today(),month=dateObj(/^\d{4}-\d{2}-\d{2}$/.test(localStorage.getItem("flowday-selected-date")||"")?localStorage.getItem("flowday-selected-date"):today()),openGroup=null,editing=null,notesView="notes";
function save(){localStorage.setItem("flowday-data",JSON.stringify(data))}function chooseDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;selected=value;localStorage.setItem("flowday-selected-date",selected);month=dateObj(selected);render()}
function toast(t){let x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1900)}
function migrate(){let old;try{old=JSON.parse(localStorage.getItem("flowday-data")||"{}")}catch{return}if(old&&Array.isArray(old.events)){let changed=false;keys.forEach(k=>{let legacy=old.events.filter(e=>e.group===k&&(k!=="today"||e.date===today()));legacy.forEach(e=>{if(!data.lists[k].some(x=>x.text===e.title)){data.lists[k].push({id:e.id||uid(),text:e.title,done:false,created:today()});changed=true}})});if(changed)save()}}
migrate();
function dayEvents(day){return data.events.filter(e=>e.date===day).sort((a,b)=>a.start.localeCompare(b.start))}function dayMarkers(day){return data.markers.filter(m=>m.date===day)}
function min(t){let a=t.split(":").map(Number);return a[0]*60+a[1]}
function timeProgress(e){let n=new Date(),v=n.getHours()*60+n.getMinutes(),a=min(e.start),b=min(e.end);return v<a||v>=b?0:(v-a)/(b-a)*100}
function eventTasks(e){return (e.tasks||[]).slice().sort((a,b)=>Number(a.done)===Number(b.done)?0:Number(b.done)-Number(a.done))}
function render(){if(data.todayStamp!==today()){data.lists.today=[];data.todayStamp=today();save()}syncThemeColor();$("#datePill").textContent=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"short"});$("#themeToggle").innerHTML=theme==="dark"?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>';
$("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#main").innerHTML=tab==="day"?renderDay():tab==="calendar"?renderCalendar():tab==="notes"?renderNotes():renderMore();renderDock();bind()}
function renderDay(){let ev=dayEvents(selected),now=new Date(),nowm=selected===today()?now.getHours()*60+now.getMinutes():selected<today()?1440:-1;return '<h1>'+ (selected===today()?"Твой день":esc(fmt(selected)))+'</h1><p class="sub">Расписание дня с 09:00 до 22:00. Нажми на событие, чтобы изменить его.</p><section class="panel day-panel"><div class="panelhead day-panelhead"><div class="day-nav"><button id="prevDay" aria-label="Предыдущий день">‹</button><input type="date" id="dayDate" value="'+selected+'" aria-label="Выбрать дату"><button id="nextDay" aria-label="Следующий день">›</button><button class="secondary today-btn" id="dayToday">Сегодня</button></div><button class="primary" id="createEvent">＋ Событие</button></div>'+renderTimeline(ev,nowm)+'</section>'}
function renderTimeline(events,nowm){const px=88,earliest=events.length?Math.min(...events.map(e=>min(e.start))):540,latest=events.length?Math.max(...events.map(e=>min(e.end))):1320,startHour=Math.min(9,Math.floor(earliest/60)),endHour=Math.max(22,Math.ceil(latest/60)),baseHeight=(endHour-startHour)*px;let cursor=0,cards=[],groups=eventGroups(events);for(const group of groups){let groupStart=Math.min(...group.map(x=>min(x.event.start))),rawTop=(groupStart-startHour*60)/60*px,top=Math.max(rawTop,cursor?cursor+10:0),lanes=Math.max(1,Math.max(...group.map(x=>x.lane))+1),bottom=top;for(const item of group){let a=min(item.event.start),b=min(item.event.end),offset=(a-groupStart)/60*px,h=Math.max((b-a)/60*px,118),left=(item.lane*100/lanes),width=100/lanes;let style='top:'+Math.round(top+offset)+'px;left:calc('+left+'% + 5px);width:calc('+width+'% - 10px);height:'+Math.round(h)+'px';let card=eventCard(item.event,nowm,style).replace('class="event ','class="event timeline-event ');cards.push(card);bottom=Math.max(bottom,top+offset+h)}cursor=bottom}let height=Math.max(baseHeight,cursor+8),labels='';for(let h=startHour;h<=endHour;h++)labels+='<span class="timeline-hour-label" style="top:'+(h-startHour)*px+'px">'+String(h).padStart(2,'0')+':00</span>';let nowLine='';if(selected===today()&&nowm>=startHour*60&&nowm<=endHour*60)nowLine='<div class="timeline-now" style="top:'+((nowm-startHour*60)/60*px)+'px"></div>';return '<div class="day-timeline"><div class="timeline-axis" style="height:'+height+'px">'+labels+'</div><div class="timeline-track" style="height:'+height+'px">'+(events.length?cards.join(''):'<div class="timeline-empty">На этот день пока нет событий.<br>Нажми «＋ Событие», чтобы добавить первое.</div>')+nowLine+'</div></div>'}
function eventGroups(events){let groups=[],cluster=[],maxEnd=-1,lanes=[];for(const e of events){let a=min(e.start),b=min(e.end);if(cluster.length&&a>=maxEnd){groups.push(cluster);cluster=[];maxEnd=-1;lanes=[]}let lane=lanes.findIndex(end=>end<=a);if(lane<0){lane=lanes.length;lanes.push(b)}else lanes[lane]=b;maxEnd=Math.max(maxEnd,b);cluster.push({event:e,lane})}if(cluster.length)groups.push(cluster);return groups}
function renderEventGrid(events,nowm){return eventGroups(events).map(group=>'<div class="eventcluster" style="grid-template-columns:repeat('+Math.max(1,Math.max(...group.map(x=>x.lane))+1)+',minmax(0,1fr))">'+group.map(x=>eventCard(x.event,nowm,'grid-column:'+(x.lane+1))).join("")+'</div>').join("")}
function eventCard(e,nowm,gridStyle=""){let a=min(e.start),b=min(e.end),past=!!e.finishedAt||b<=nowm,current=!e.finishedAt&&a<=nowm&&b>nowm,state=past?"past":current?"active":"upcoming",pct=current?timeProgress(e):0;return '<article class="event '+(past?"past ":"")+(current?"current":"")+'" data-event="'+e.id+'" data-event-state="'+state+'" style="--event-color:'+esc(e.color||"#d978a5")+' ;'+gridStyle+'"><div class="eventtop"><div class="eventname">'+esc(e.title)+'</div><div class="eventtime">'+e.start+' – '+e.end+'</div></div>'+(e.finishedAt?'<div class="eventdesc">Завершено в '+esc(e.finishedAt)+'</div>':'')+(e.description?'<div class="eventdesc">'+esc(e.description)+'</div>':'')+(current?'<div class="eventprogress"><span style="width:'+pct+'%"></span></div><button type="button" class="event-finish" data-event-finish="'+e.id+'">✓ Закончить событие</button>':'')+(e.tasks?.length?'<div class="subtasks">'+eventTasks(e).map(t=>'<div class="subtask"><button class="check '+(t.done?"done":"")+'" data-event-task="'+t.id+'" data-eid="'+e.id+'">'+(t.done?"✓":"")+'</button><span class="'+(t.done?"doneText":"")+'">'+esc(t.text)+'</span></div>').join("")+'</div>':'')+'</article>'}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),total=42,html='<h1>Календарь</h1><p class="sub">В календаре отображаются только отметки.</p><section class="panel calendar"><div class="panelhead"><div class="calendar-toolbar"><button class="month-arrow" id="prevMonth" aria-label="Предыдущий месяц">‹</button><b class="month-label">'+first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button class="month-arrow" id="nextMonth" aria-label="Следующий месяц">›</button><button class="secondary" id="monthToday">Сегодня</button></div></div><div class="calendar-grid">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>'<div class="weekday">'+x+'</div>').join("");for(let i=0;i<total;i++){let d=new Date(y,m,i-offset+1),s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),ms=dayMarkers(s);html+='<button class="calendar-cell '+(d.getMonth()!==m?"outside ":"")+(s===selected?"selected ":"")+(s===today()?"today":"")+'" data-date="'+s+'"><span class="num">'+d.getDate()+'</span><div class="dots">'+ms.slice(0,4).map(v=>'<i class="dot" style="background:'+esc(v.color||"#59bd9a")+'"></i>').join("")+'</div></button>'}html+='</div></section><section class="panel calendar" style="margin-top:16px"><div class="panelhead"><b>'+esc(fmt(selected))+'</b><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="primary" id="createMarker">＋ Отметка</button></div></div>'+(msafe(dayMarkers(selected).length)?'<div class="taskitems">'+dayMarkers(selected).map(v=>'<div class="taskitem"><span class="dot" style="background:'+esc(v.color||"#59bd9a")+';margin-top:7px"></span><span class="tasktext">'+esc(v.title)+'</span><button class="delete-task" data-marker-delete="'+v.id+'">×</button></div>').join("")+'</div>':'')+(dayMarkers(selected).length?'':'<p class="muted small">На эту дату пока нет отметок.</p>')+'</section>';return html}function msafe(n){return n>0}
function renderNotes(){let labels={notes:"Мои заметки",homework:"ДЗ",general:"Общие дела",urgent:"Срочные дела",today:"Сегодняшние дела"},descriptions={homework:"Задания по срокам",general:"Постоянный список",urgent:"Важные незавершённые дела",today:"На выбранную дату"};let counts={homework:data.lists.homework.length,general:data.lists.general.length,urgent:data.lists.urgent.length,today:data.lists.today.filter(t=>(t.date||t.created||today())===selected).length};let nav='<div class="notes-nav"><button class="'+(notesView==="notes"?"active":"")+'" data-notes-view="notes">Мои заметки</button></div><div class="notes-options">'+["homework","general","urgent","today"].map(k=>'<button class="notes-option '+(notesView===k?"active":"")+'" data-notes-view="'+k+'"><strong>'+labels[k]+'</strong><small>'+descriptions[k]+'</small><span class="option-foot"><span class="option-count">'+counts[k]+'</span><small>'+(k==="today"?"на "+esc(fmt(selected)):k==="homework"?"по дедлайнам":"записей")+'</small></span></button>').join("")+'</div>';if(notesView!=="notes"){let items=data.lists[notesView]||[];if(notesView==="today")items=items.filter(t=>(t.date||t.created||today())===selected);if(notesView==="homework")items=items.slice().sort((a,b)=>(a.date||a.created||"9999").localeCompare(b.date||b.created||"9999"));let content=items.length?items.map(t=>'<div class="taskitem '+(t.done?"completed":"")+'"><button class="check '+(t.done?"done":"")+'" data-list-check="'+t.id+'" data-group="'+notesView+'">'+(t.done?"✓":"")+'</button><span class="tasktext">'+esc(t.text)+'</span>'+(notesView==="homework"?'<span class="notes-due">'+esc(t.date||t.created||"Без даты")+'</span>':'')+'<button class="delete-task" data-list-delete="'+t.id+'" data-group="'+notesView+'" aria-label="Удалить">×</button></div>').join(""):'<div class="empty">В этой категории пока нет записей.</div>';return '<h1>Заметки</h1><p class="sub">Выбери категорию, чтобы посмотреть записи и сроки.</p>'+nav+'<section class="panel"><div class="notes-list-head"><b>'+labels[notesView]+'</b><span class="muted small">'+items.length+' записей</span></div><div class="notes-category-list">'+content+'</div></section>'}return '<h1>Заметки</h1><p class="sub">Личный блокнот. Записи сохраняются автоматически и могут отправляться копией в любой список.</p>'+nav+'<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="primary" id="newNote">＋ Новая заметка</button></div><div class="note-grid">'+(data.notes.length?data.notes.slice().sort((a,b)=>(b.updated||b.created||"").localeCompare(a.updated||a.created||"")).map(n=>'<details class="note-card" data-note-details="'+n.id+'" '+(n.expanded?"open":"")+'><summary><span class="note-summary-title">'+(n.text.trim()?esc(n.text.trim().split("\\n")[0].slice(0,38)):"Новая заметка")+'</span><span class="note-preview">'+esc(n.text.trim().replace(/\\s+/g," ").slice(0,300)||"Нажми, чтобы написать")+'</span></summary><textarea class="note-editor" data-note-editor="'+n.id+'" rows="4" placeholder="Начни писать…">'+esc(n.text||"")+'</textarea><div class="note-actions"><span class="muted small">Сохраняется автоматически</span><span style="flex:1"></span><label class="muted small" for="note-dest-'+n.id+'">Отправить копию:</label><select id="note-dest-'+n.id+'" data-note-category="'+n.id+'"><option value="general">Общие дела</option><option value="urgent">Срочные дела</option><option value="today">Сегодняшние дела</option><option value="homework">ДЗ</option></select><span class="note-homework-date" data-note-date-wrap="'+n.id+'"><label class="muted small" for="note-date-'+n.id+'">Дата ДЗ:</label><input type="date" id="note-date-'+n.id+'" data-note-date="'+n.id+'" value="'+selected+'"></span><button class="secondary" data-note-send="'+n.id+'">Отправить</button><button class="ghost danger" data-note-delete="'+n.id+'">Удалить</button></div></details>').join(""):'<section class="panel empty">Здесь пока пусто. Создай первую заметку.</section>')+'</div>'}function renderMore(){return '<h1>Ещё</h1><p class="sub">Контакты, полезные сведения и резервная копия данных.</p><section class="panel"><div class="panelhead"><h2>Сведения</h2><button class="secondary" id="addInfo">＋ Добавить</button></div>'+(data.info.length?data.info.map((x,i)=>'<div class="taskitem"><div class="tasktext"><b>'+esc(x.title)+'</b><div class="muted small">'+esc(x.value)+'</div></div><button class="delete-task" data-del-info="'+i+'">×</button></div>').join(""):'<p class="muted small">Добавь контакты преподавателей, номера телефонов и другую важную информацию.</p>')+'</section><section class="panel" style="margin-top:14px"><div class="panelhead"><h2>Данные приложения</h2></div><p class="muted small">Данные хранятся в этом браузере. Создай резервную копию, чтобы перенести их на другое устройство.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" id="exportData">Экспортировать</button><label class="secondary" style="cursor:pointer">Импортировать<input type="file" id="importData" accept="application/json" hidden></label><button class="ghost danger" id="clearData">Очистить всё</button></div></section>'}
function renderDock(){let dock=$("#taskdock");dock.classList.toggle("open",!!openGroup);$$(".docktab").forEach(b=>b.classList.toggle("active",b.dataset.group===openGroup));if(!openGroup){$("#dockpanel").innerHTML="";return}let items=(openGroup==="today"||openGroup==="homework")?data.lists[openGroup].filter(t=>(t.date||t.created||today())===selected):data.lists[openGroup];$("#dockpanel").innerHTML='<div class="dockhead"><h3>'+labels[openGroup]+'</h3><button class="ghost" id="closeDock">Свернуть ×</button></div><div class="taskitems">'+(items.length?items.map(t=>'<div class="taskitem '+(t.done?"completed":"")+'"><button class="check '+(t.done?"done":"")+'" data-list-check="'+t.id+'" data-group="'+openGroup+'">'+(t.done?"✓":"")+'</button><span class="tasktext">'+esc(t.text)+'</span><button class="delete-task" data-list-delete="'+t.id+'" data-group="'+openGroup+'" aria-label="Удалить">×</button></div>').join(""):'<div class="dock-empty">Список пока пуст. Добавь первую запись ниже.</div>')+'</div><form class="quickadd" id="quickAdd"><input id="quickText" maxlength="240" placeholder="Записать дело…"><button type="submit" aria-label="Добавить">＋</button></form>'}
function openModal(e){editing=e?.id||null;let v=e||{};$("#modalTitle").textContent=e?"Редактировать событие":"Новое событие";$("#modalBody").innerHTML='<form id="eventForm"><div class="formgrid"><div class="field full"><label>Название</label><input name="title" maxlength="100" required value="'+esc(v.title||"")+'" placeholder="Например, учёба"></div><div class="field"><label>Дата</label><input type="date" name="date" required value="'+(v.date||selected)+'"></div><div class="field"><label>Начало</label><input type="time" name="start" required value="'+(v.start||"09:00")+'"></div><div class="field"><label>Конец</label><input type="time" name="end" required value="'+(v.end||"10:00")+'"></div><div class="field"><label>Цвет</label><input type="color" name="color" value="'+(v.color||"#d978a5")+'" style="height:42px"></div><div class="field full"><label>Описание</label><textarea name="description" placeholder="Дополнительная информация">'+esc(v.description||"")+'</textarea></div><div class="field full"><label>Чек-лист</label><div id="taskEditor" class="subtasks">'+(v.tasks||[]).map(t=>taskRow(t.text,t.done)).join("")+'</div><button class="ghost" type="button" id="addSubtask">＋ Подзадача</button></div></div><div class="modalactions">'+(e?'<button type="button" class="ghost danger" id="deleteEvent">Удалить</button>':'<span></span>')+'<div style="display:flex;gap:8px"><button type="button" class="ghost" id="cancelEvent">Отмена</button><button class="primary" type="submit">Сохранить</button></div></div></form>';
$("#cancelEvent").onclick=closeModal;$("#addSubtask").onclick=()=>$("#taskEditor").insertAdjacentHTML("beforeend",taskRow("",false));$("#taskEditor").onclick=ev=>{if(ev.target.matches("[data-remove-subtask]"))ev.target.closest(".taskinput").remove()};if(e)$("#deleteEvent").onclick=()=>{if(confirm("Удалить событие?")){data.events=data.events.filter(x=>x.id!==e.id);save();closeModal();render()}};
$("#eventForm").onsubmit=ev=>{ev.preventDefault();let f=new FormData(ev.currentTarget),date=f.get("date"),start=f.get("start"),end=f.get("end");if(end<=start){toast("Время окончания должно быть позже начала");return}let tasks=$$("#taskEditor .taskinput").map((row,i)=>({id:row.dataset.id||uid(),text:row.querySelector("input").value.trim(),done:row.querySelector("input[type=checkbox]")?.checked||false})).filter(t=>t.text);let obj={id:v.id||uid(),title:f.get("title").trim(),date,start,end,color:f.get("color"),description:f.get("description"),tasks};if(editing)data.events=data.events.map(x=>x.id===editing?obj:x);else data.events.push(obj);save();closeModal();render();toast("Событие сохранено")};$("#modalback").classList.add("show")}
function openMarkerModal(){$("#modalTitle").textContent="Новая отметка";$("#modalBody").innerHTML='<form id="markerForm"><div class="field"><label>Название отметки</label><input name="title" maxlength="100" required placeholder="Например, день рождения"></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Дата</label><input type="date" name="date" required value="'+selected+'"></div><div class="field"><label>Цвет</label><input type="color" name="color" value="#59bd9a" style="height:42px"></div></div><div class="modalactions"><span></span><div style="display:flex;gap:8px"><button type="button" class="ghost" id="cancelEvent">Отмена</button><button class="primary" type="submit">Сохранить</button></div></div></form>';$("#cancelEvent").onclick=closeModal;$("#markerForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget);data.markers.push({id:uid(),title:f.get("title").trim(),date:f.get("date"),color:f.get("color")});save();closeModal();render();toast("Отметка добавлена")};$("#modalback").classList.add("show")}function taskRow(text,done){return '<div class="taskinput" data-id="'+uid()+'"><input value="'+esc(text)+'" placeholder="Подзадача"><label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><input type="checkbox" '+(done?"checked":"")+'>Готово</label><button type="button" data-remove-subtask>×</button></div>'}
function closeModal(){$("#modalback").classList.remove("show")}
function bind(){$("#themeToggle").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("flowday-theme",theme);render()};$("#addEvent").onclick=()=>openModal();let ce=$("#createEvent");if(ce)ce.onclick=()=>openModal();let cm=$("#createMarker");if(cm)cm.onclick=()=>openMarkerModal();
let p=$("#prevDay"),n=$("#nextDay"),dd=$("#dayDate"),dt=$("#dayToday");if(p)p.onclick=()=>chooseDate(addDays(selected,-1));if(n)n.onclick=()=>chooseDate(addDays(selected,1));if(dd)dd.onchange=()=>chooseDate(dd.value);if(dt)dt.onclick=()=>chooseDate(today());
$$("[data-marker-delete]").forEach(b=>b.onclick=()=>{data.markers=data.markers.filter(m=>m.id!==b.dataset.markerDelete);save();render()});$$("[data-event]").forEach(el=>el.onclick=()=>{let e=data.events.find(x=>x.id===el.dataset.event);if(e)openModal(e)});
$$("[data-event-finish]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();let e=data.events.find(x=>x.id===b.dataset.eventFinish);if(e&&!e.finishedAt){e.finishedAt=new Date().toTimeString().slice(0,5);save();render();toast("Событие завершено")}});
$$("[data-event-task]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();let e=data.events.find(x=>x.id===b.dataset.eid),t=e?.tasks?.find(x=>x.id===b.dataset.eventTask);if(t){t.done=!t.done;save();render()}});
$$("[data-date]").forEach(b=>b.onclick=()=>chooseDate(b.dataset.date));
let pm=$("#prevMonth"),nm=$("#nextMonth"),mt=$("#monthToday");if(pm)pm.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};if(nm)nm.onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};if(mt)mt.onclick=()=>chooseDate(today());
let ai=$("#addInfo");if(ai)ai.onclick=()=>{let title=prompt("Название (например, Преподаватель)");if(!title)return;let value=prompt("Контакт или информация");if(value===null)return;data.info.push({title,value});save();render()};$$("[data-del-info]").forEach(b=>b.onclick=()=>{data.info.splice(Number(b.dataset.delInfo),1);save();render()});let ex=$("#exportData");if(ex)ex.onclick=()=>{let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=url;a.download="flowday-backup.json";a.click();URL.revokeObjectURL(url)};let im=$("#importData");if(im)im.onchange=async()=>{try{let x=JSON.parse(await im.files[0].text());if(!Array.isArray(x.events))throw 0;data={...blank(),...x,lists:{...blank().lists,...(x.lists||{})}};save();render();toast("Данные импортированы")}catch{toast("Не удалось прочитать файл")}};let cl=$("#clearData");if(cl)cl.onclick=()=>{if(confirm("Удалить все события, списки, заметки и сведения?")){data=blank();save();render()}};let ne=$("#noteEditor");if(ne)ne.oninput=()=>{data.notes=ne.value;save()};let sn=$("#sendNote");if(sn)sn.onclick=()=>{let text=$("#noteEditor").value.trim();if(!text){toast("Сначала напиши заметку");return}let k=$("#noteCategory").value;data.lists[k].push({id:uid(),text,done:false,created:today(),...(k==="today"?{date:selected}:{})});data.notes="";save();openGroup=k;render();toast("Добавлено в "+labels[k].toLowerCase())};
let newNoteBtn=$("#newNote");if(newNoteBtn)newNoteBtn.onclick=()=>{data.notes.unshift({id:uid(),text:"",created:today(),updated:new Date().toISOString(),expanded:true});save();render();let area=$("[data-note-editor]");if(area)area.focus()};
$$("[data-note-editor]").forEach(area=>area.oninput=()=>{let n=data.notes.find(x=>x.id===area.dataset.noteEditor);if(n){n.text=area.value;n.updated=new Date().toISOString();let summary=area.closest("details")?.querySelector("summary .note-preview");if(summary)summary.textContent=area.value.trim().replace(/\s+/g," ").slice(0,90)||"Нажми, чтобы написать";save()}});
$$("[data-note-details]").forEach(d=>d.addEventListener("toggle",()=>{let n=data.notes.find(x=>x.id===d.dataset.noteDetails);if(n){n.expanded=d.open;save()}}));$$("[data-notes-view]").forEach(b=>b.onclick=()=>{notesView=b.dataset.notesView;render()});$$("[data-list-check][data-group]").forEach(b=>{if(b.closest("#dockpanel"))return;b.onclick=()=>{let t=data.lists[b.dataset.group].find(x=>x.id===b.dataset.listCheck);if(t){t.done=!t.done;save();render()}}});$$("[data-list-delete][data-group]").forEach(b=>{if(b.closest("#dockpanel"))return;b.onclick=()=>{data.lists[b.dataset.group]=data.lists[b.dataset.group].filter(x=>x.id!==b.dataset.listDelete);save();render()}});$$("[data-note-category]").forEach(sel=>{let wrap=$('[data-note-date-wrap="'+sel.dataset.noteCategory+'"]');if(wrap)wrap.style.display=sel.value==="homework"?"flex":"none";sel.onchange=()=>{if(wrap)wrap.style.display=sel.value==="homework"?"flex":"none"}});$$("[data-note-send]").forEach(btn=>btn.onclick=()=>{let n=data.notes.find(x=>x.id===btn.dataset.noteSend),sel=$('[data-note-category="'+btn.dataset.noteSend+'"]');if(!n||!n.text.trim()){toast("Сначала напиши заметку");return}let k=sel.value,dateInput=$('[data-note-date="'+btn.dataset.noteSend+'"]');data.lists[k].push({id:uid(),text:n.text.trim(),done:false,created:today(),...((k==="today"||k==="homework")?{date:k==="homework"?(dateInput?.value||selected):selected}:{})});save();openGroup=k;render();toast("Копия добавлена в "+labels[k].toLowerCase())});
$$("[data-note-delete]").forEach(btn=>btn.onclick=()=>{data.notes=data.notes.filter(n=>n.id!==btn.dataset.noteDelete);save();render()});
}
$("#tabs").onclick=e=>{let b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;render()};
$("#taskdock").onclick=e=>{let b=e.target.closest(".docktab[data-group]");if(!b)return;openGroup=openGroup===b.dataset.group?null:b.dataset.group;renderDock()};
$("#dockpanel").onclick=e=>{let c=e.target.closest("[data-list-check]");if(c){let t=data.lists[c.dataset.group].find(x=>x.id===c.dataset.listCheck);if(t){t.done=!t.done;save();renderDock()};return}let d=e.target.closest("[data-list-delete]");if(d){data.lists[d.dataset.group]=data.lists[d.dataset.group].filter(x=>x.id!==d.dataset.listDelete);save();renderDock();return}if(e.target.id==="closeDock"){openGroup=null;renderDock()}};
$("#dockpanel").onsubmit=e=>{if(e.target.id!=="quickAdd")return;e.preventDefault();let input=$("#quickText"),text=input.value.trim();if(!text)return;data.lists[openGroup].push({id:uid(),text,done:false,created:today(),...((openGroup==="today"||openGroup==="homework")?{date:selected}:{})});save();renderDock();$("#quickText").focus()};
$("#closeModal").onclick=closeModal;$("#modalback").onclick=e=>{if(e.target===$("#modalback"))closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();openGroup=null;renderDock()}});
if("serviceWorker"in navigator&&location.protocol!=="file:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();setInterval(()=>{if(tab==="day"&&selected===today())render()},60000);
})();
</script>
