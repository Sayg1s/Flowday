<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иконка F</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .icon {
            width: 400px;
            height: 400px;
            border-radius: 80px;
            background: linear-gradient(135deg, #f9b8d0 0%, #f0a0c0 30%, #e88ab0 60%, #d870a0 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .icon::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 120%;
            height: 60%;
            background: linear-gradient(180deg, transparent 0%, rgba(200, 80, 140, 0.2) 50%, rgba(180, 60, 120, 0.3) 100%);
            border-radius: 50% 50% 0 0;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(135deg, rgba(210, 100, 160, 0.3) 0%, rgba(190, 70, 130, 0.4) 100%);
            border-radius: 0 0 80px 80px;
            clip-path: ellipse(70% 80% at 50% 100%);
        }

        .wave2 {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 50%;
            background: linear-gradient(225deg, rgba(255,255,255,0.1) 0%, transparent 60%);
            border-radius: 0 80px 0 0;
            clip-path: ellipse(80% 70% at 100% 0%);
        }

        .letter-f {
            position: relative;
            z-index: 10;
            width: 180px;
            height: 220px;
        }

        .letter-f svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="icon">
        <div class="wave"></div>
        <div class="wave2"></div>
        <div class="letter-f">
            <svg viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg">
                <path d="M 30 10 
                         L 140 10 
                         A 25 25 0 0 1 140 60 
                         L 75 60 
                         A 15 15 0 0 0 60 75 
                         L 60 90 
                         A 15 15 0 0 0 75 105 
                         L 120 105 
                         A 25 25 0 0 1 120 155 
                         L 75 155 
                         A 15 15 0 0 0 60 170 
                         L 60 195 
                         A 30 30 0 0 1 0 195 
                         L 0 55 
                         A 45 45 0 0 1 30 10 Z" 
                      fill="white"/>
            </svg>
        </div>
    </div>
</body>
</html>
